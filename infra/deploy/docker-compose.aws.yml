# Production compose for the EC2 host: backend + frontend only. Postgres is
# managed by RDS, so DATABASE_URL points at the RDS endpoint (supplied via the
# .env file on the host -- see infra/README.md).
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL}
    restart: unless-stopped
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      - backend
    restart: unless-stopped
    ports:
      - "80:80"