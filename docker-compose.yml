# Local full-stack: Postgres + FastAPI/C++ backend + nginx-served React app.
#   docker compose up --build
# Then open http://localhost:8080
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lob}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lob_password}
      POSTGRES_DB: ${POSTGRES_DB:-orderbook}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lob} -d ${POSTGRES_DB:-orderbook}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-lob}:${POSTGRES_PASSWORD:-lob_password}@postgres:5432/${POSTGRES_DB:-orderbook}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  pgdata: